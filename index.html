<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Porter Home Library</title>

  <link
    rel="apple-touch-icon"
    href="./apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="./porter-icon.png"
  >

  <meta name="theme-color" content="#F5F0E6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Porter Library">

  <style>
    :root {
      --cream: #F5F0E6;
      --navy: #16324F;
      --muted: #53697A;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--cream);
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 2;

      display: grid;
      place-items: center;

      background: var(--cream);
      color: var(--navy);
      text-align: center;

      transition:
        opacity 350ms ease,
        visibility 350ms ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      padding: 32px 24px;
    }

    .logo {
      width: 160px;
      height: 160px;
      border-radius: 32px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    #libraryFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="splash-content">
      <img
        class="logo"
        src="./porter-icon.png"
        alt="Porter Home Library"
      >

      <h1>Porter Home Library</h1>
      <p>Opening your family library…</p>
    </div>
  </div>

  <iframe
    id="libraryFrame"
    title="Porter Home Library"
    src="https://script.google.com/macros/s/AKfycbwVu_8w1Y7zhlBSlnLxUok8J2gzth9lKP_vXf-dwZxEfwxvJZ8OzBf4qexu5DIuFj6X/exec"
    allow="camera; microphone"
  ></iframe>

  <script>
    const splash = document.getElementById('splash');
    const libraryFrame = document.getElementById('libraryFrame');

    let minimumSplashFinished = false;
    let libraryLoaded = false;

    function hideSplashWhenReady() {
      if (minimumSplashFinished && libraryLoaded) {
        splash.classList.add('hidden');
      }
    }

    window.setTimeout(() => {
      minimumSplashFinished = true;
      hideSplashWhenReady();
    }, 1000);

    libraryFrame.addEventListener('load', () => {
      libraryLoaded = true;
      hideSplashWhenReady();
    });

    window.setTimeout(() => {
      splash.classList.add('hidden');
    }, 8000);
  </script>
</body>
</html>
